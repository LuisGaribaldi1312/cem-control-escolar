<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CEM · Centro Escolar · Preinscripciones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --navy-950:#050b26;
    --navy-900:#0a1a45;
    --navy-800:#132868;
    --navy-100:#e7eaf5;
    --gold-600:#a9812f;
    --gold-500:#c9a24e;
    --gold-100:#f3e9d2;
    --paper:#ded0a9;
    --paper-2:#c2b382;
    --ink:#1b2033;
    --ink-soft:#5a5f72;
    --line:#dcd7c8;
    --green:#276b45;
    --green-bg:#e3efe6;
    --red:#a83a2c;
    --red-bg:#f6e6e2;
    --amber:#9a6b12;
    --amber-bg:#f6ecd8;
    --radius:10px;
    --shadow:0 10px 30px -12px rgba(10,26,69,.25);
    --serif:"Source Serif 4", Georgia, serif;
    --sans:"Inter", -apple-system, sans-serif;
    --mono:"JetBrains Mono", monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:var(--sans);}
  body{min-height:100vh;}
  ::selection{background:var(--gold-100);}
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}
  #app{max-width:1180px;margin:0 auto;padding:0 24px 80px;}
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:18px 24px;background:var(--navy-950);color:#fff;
    border-bottom:3px solid var(--gold-500);
  }
  .topbar-inner{max-width:1180px;margin:0 auto;width:100%;display:flex;align-items:center;justify-content:space-between;}
  .brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:#fff;}
  .brand img{height:40px;width:40px;filter:brightness(0) invert(1);}
  .brand-text .name{font-family:var(--serif);font-weight:700;font-size:19px;letter-spacing:.2px;line-height:1.1;}
  .brand-text .sub{font-size:11px;color:var(--gold-100);letter-spacing:1.5px;text-transform:uppercase;}
  .nav-links{display:flex;gap:6px;}
  .nav-links a{
    padding:8px 14px;border-radius:999px;font-size:13.5px;font-weight:500;
    color:var(--navy-100);text-decoration:none;border:1px solid transparent;
    transition:background .15s;
  }
  .nav-links a:hover{background:rgba(255,255,255,.08);}
  .nav-links a.primary{background:var(--gold-500);color:var(--navy-950);font-weight:700;}
  .nav-links a.primary:hover{background:var(--gold-600);}

  .storage-banner{background:var(--amber-bg);color:var(--amber);border-bottom:1px solid var(--line);
    font-size:13px;padding:9px 24px;text-align:center;}

  .hero{padding:56px 0 36px;position:relative;}
  .hero-crest{display:flex;justify-content:center;margin-bottom:18px;}
  .hero-crest img{height:96px;width:96px;}
  .hero h1{font-family:var(--serif);font-size:clamp(28px,4vw,42px);text-align:center;line-height:1.15;
    margin:0 0 12px;color:var(--navy-950);font-weight:700;}
  .hero p.lead{text-align:center;max-width:640px;margin:0 auto 30px;color:var(--ink-soft);font-size:16px;line-height:1.6;}
  .hero-actions{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;}

  .btn{
    display:inline-flex;align-items:center;gap:8px;border:none;border-radius:8px;
    padding:12px 22px;font-size:14.5px;font-weight:600;text-decoration:none;
  }
  .btn-gold{background:var(--gold-500);color:var(--navy-950);}
  .btn-gold:hover{background:var(--gold-600);}
  .btn-navy{background:var(--navy-900);color:#fff;}
  .btn-navy:hover{background:var(--navy-800);}
  .btn-ghost{background:transparent;color:var(--navy-900);border:1.5px solid var(--navy-900);}
  .btn-ghost:hover{background:var(--navy-100);}
  .btn-danger{background:var(--red-bg);color:var(--red);}
  .btn-sm{padding:7px 14px;font-size:13px;border-radius:7px;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}

  .modalities{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin:40px 0;}
  @media(max-width:820px){.modalities{grid-template-columns:1fr;}}
  .mod-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);}
  .mod-card .eyebrow{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold-600);font-weight:700;margin-bottom:8px;}
  .mod-card h3{font-family:var(--serif);margin:0 0 8px;font-size:20px;color:var(--navy-950);}
  .mod-card p{margin:0;color:var(--ink-soft);font-size:14px;line-height:1.55;}

  .card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:28px;margin-bottom:22px;}
  .card h2{font-family:var(--serif);font-size:22px;margin:0 0 6px;color:var(--navy-950);}
  .card .card-sub{color:var(--ink-soft);font-size:14px;margin:0 0 20px;}

  .section-title{font-family:var(--serif);font-size:16px;color:var(--navy-900);
    text-transform:uppercase;letter-spacing:1px;font-weight:600;margin:26px 0 14px;
    padding-bottom:8px;border-bottom:1px solid var(--line);}
  .section-title:first-child{margin-top:0;}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media(max-width:640px){.grid2{grid-template-columns:1fr;}}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:13px;font-weight:600;color:var(--navy-900);margin-bottom:6px;}
  .field .hint{font-weight:400;color:var(--ink-soft);font-size:12px;}
  .field input[type=text],.field input[type=tel],.field input[type=email],.field input[type=date],
  .field input[type=number],.field input[type=password],.field select,.field textarea{
    width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:7px;font-size:14.5px;
    background:#fff;color:var(--ink);
  }
  .field input:focus,.field select:focus,.field textarea:focus{outline:2.5px solid var(--gold-500);outline-offset:1px;border-color:var(--gold-500);}
  .field textarea{resize:vertical;min-height:70px;}

  .doc-row{display:flex;align-items:center;justify-content:space-between;gap:14px;
    padding:14px 16px;border:1.5px dashed var(--line);border-radius:8px;margin-bottom:10px;background:var(--paper);}
  .doc-row.ok{border-style:solid;border-color:var(--green);background:var(--green-bg);}
  .doc-row .doc-label{font-weight:600;font-size:14px;}
  .doc-row .doc-meta{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .doc-row .doc-status{font-size:12px;font-weight:700;}
  .doc-actions{display:flex;gap:8px;align-items:center;}
  .file-btn{position:relative;overflow:hidden;display:inline-flex;}
  .file-btn input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;}

  .badge{display:inline-block;padding:4px 11px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:.2px;}
  .badge-green{background:var(--green-bg);color:var(--green);}
  .badge-red{background:var(--red-bg);color:var(--red);}
  .badge-amber{background:var(--amber-bg);color:var(--amber);}
  .badge-navy{background:var(--navy-100);color:var(--navy-900);}

  .msg{padding:12px 16px;border-radius:8px;font-size:13.5px;margin-bottom:16px;}
  .msg-error{background:var(--red-bg);color:var(--red);}
  .msg-ok{background:var(--green-bg);color:var(--green);}
  .msg-info{background:var(--navy-100);color:var(--navy-900);}

  .folio-search{display:flex;gap:10px;margin-bottom:26px;}
  .folio-search input{flex:1;padding:12px 14px;border:1.5px solid var(--line);border-radius:8px;font-size:15px;font-family:var(--mono);}

  .confirm-wrap{display:flex;gap:32px;flex-wrap:wrap;align-items:flex-start;}
  .qr-box{background:#fff;border:2px solid var(--navy-950);border-radius:12px;padding:20px;text-align:center;flex:0 0 240px;}
  .qr-box .folio-num{font-family:var(--mono);font-weight:700;font-size:16px;margin-top:10px;color:var(--navy-950);letter-spacing:.5px;}
  .qr-box .folio-tag{font-size:10.5px;text-transform:uppercase;letter-spacing:1.5px;color:var(--gold-600);font-weight:700;margin-bottom:2px;}

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{text-align:left;padding:10px 12px;background:var(--navy-950);color:#fff;font-size:11.5px;
    text-transform:uppercase;letter-spacing:.6px;font-weight:600;}
  th:first-child{border-top-left-radius:6px;}
  th:last-child{border-top-right-radius:6px;}
  td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle;}
  tr.clickable{cursor:pointer;}
  tr.clickable:hover td{background:var(--navy-100);}
  .table-wrap{overflow-x:auto;border-radius:8px;border:1px solid var(--line);}

  .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:26px;}
  @media(max-width:760px){.stat-grid{grid-template-columns:repeat(2,1fr);}}
  .stat{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px;}
  .stat .num{font-family:var(--serif);font-size:30px;font-weight:700;color:var(--navy-950);}
  .stat .lbl{font-size:12px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.6px;margin-top:2px;}

  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;}
  .chip{padding:7px 14px;border-radius:999px;font-size:13px;font-weight:600;border:1.5px solid var(--line);
    background:#fff;color:var(--ink-soft);}
  .chip.active{background:var(--navy-950);color:#fff;border-color:var(--navy-950);}

  .toolbar{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:18px;flex-wrap:wrap;}
  .search-box{padding:9px 13px;border:1.5px solid var(--line);border-radius:7px;font-size:13.5px;width:260px;max-width:100%;}

  .overlay{position:fixed;inset:0;background:rgba(5,11,38,.55);display:flex;align-items:flex-start;justify-content:center;
    padding:40px 16px;overflow-y:auto;z-index:50;}
  .modal{background:var(--paper);border-radius:12px;max-width:760px;width:100%;box-shadow:0 30px 60px -20px rgba(0,0,0,.5);}
  .modal-head{display:flex;justify-content:space-between;align-items:flex-start;padding:22px 26px;background:var(--navy-950);color:#fff;
    border-radius:12px 12px 0 0;}
  .modal-head h2{font-family:var(--serif);margin:0 0 4px;font-size:21px;}
  .modal-head .sub{font-size:12.5px;color:var(--gold-100);font-family:var(--mono);}
  .modal-body{padding:24px 26px;}
  .close-x{background:rgba(255,255,255,.12);border:none;color:#fff;width:30px;height:30px;border-radius:7px;font-size:16px;}

  .kv{display:grid;grid-template-columns:1fr 1fr;gap:4px 20px;font-size:14px;margin-bottom:4px;}
  .kv div span.k{color:var(--ink-soft);font-size:12px;display:block;}
  .kv div span.v{font-weight:600;}
  @media(max-width:600px){.kv{grid-template-columns:1fr;}}

  .payform{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:10px;align-items:end;margin-bottom:16px;}
  @media(max-width:700px){.payform{grid-template-columns:1fr 1fr;}}
  .payform label{font-size:11.5px;font-weight:600;color:var(--navy-900);display:block;margin-bottom:5px;}
  .payform input,.payform select{width:100%;padding:8px 10px;border:1.5px solid var(--line);border-radius:6px;font-size:13.5px;}

  footer.pagefoot{text-align:center;color:var(--ink-soft);font-size:12px;padding:30px 0 10px;}

  .login-wrap{max-width:400px;margin:70px auto 0;}
  .fine{font-size:12px;color:var(--ink-soft);line-height:1.6;}
  .link-btn{background:none;border:none;color:var(--navy-800);font-weight:600;font-size:13px;text-decoration:underline;padding:0;}

  .empty-state{text-align:center;padding:50px 20px;color:var(--ink-soft);}
  .empty-state .glyph{font-size:34px;margin-bottom:10px;}

  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px;}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--navy-950);color:#fff;
    padding:12px 20px;border-radius:8px;font-size:13.5px;box-shadow:var(--shadow);z-index:100;
    border-left:4px solid var(--gold-500);}
  .toast.error{border-left-color:var(--red);}

  [data-fade]{animation:fadeIn .25s ease both;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

  :focus-visible{outline:2.5px solid var(--gold-500);outline-offset:2px;}
</style>
</head>

<div id="app"></div>

<script>
/* ============================= CONFIGURACIÓN ============================= */
const MODALIDADES = {
  modular:   { label: "Modalidad Modular",           eyebrow:"Flexible",   desc:"Avance por módulos a tu propio ritmo, con evaluaciones periódicas y acompañamiento docente." },
  prepa3:    { label: "Preparatoria · 3 meses",       eyebrow:"Intensivo",  desc:"Programa acelerado de preparatoria diseñado para concluir el nivel en un trimestre." },
  prepa4:    { label: "Preparatoria · 4 meses",       eyebrow:"Regular",    desc:"Programa de preparatoria en cuatro meses, con ritmo equilibrado entre materias." },
};

const DOCS_REQUERIDOS = [
  { key:"acta",        label:"Acta de nacimiento" },
  { key:"curp_doc",    label:"CURP (documento)" },
  { key:"domicilio",   label:"Comprobante de domicilio" },
  { key:"certificado", label:"Certificado o boleta de estudios previos" },
  { key:"ine_tutor",   label:"INE del padre, madre o tutor" },
];

const MAX_FILE_MB = 5;

/* ============================= CLIENTE DE API ============================= */
const API = ''; // mismo origen: el backend sirve también este archivo
let adminToken = localStorage.getItem('cem_admin_token') || null;

async function api(path, opts = {}) {
  const headers = Object.assign({}, opts.headers || {});
  if (!(opts.body instanceof FormData) && opts.body) headers['Content-Type'] = 'application/json';
  if (adminToken) headers['Authorization'] = `Bearer ${adminToken}`;
  const res = await fetch(API + path, Object.assign({}, opts, { headers }));
  let data = null;
  try { data = await res.json(); } catch (e) { /* respuesta sin cuerpo JSON (ej. archivo) */ }
  if (!res.ok) {
    if (res.status === 401) { logoutAdmin(); }
    throw new Error((data && data.error) || 'Ocurrió un error al comunicarse con el servidor.');
  }
  return data;
}

function logoutAdmin(){
  adminToken = null; isAdminAuthed = false;
  localStorage.removeItem('cem_admin_token');
}

/* ============================= ESTADO EFÍMERO ============================= */
let isAdminAuthed = !!adminToken;
let uiState = { filter:'todos', search:'', detailFolio:null };

/* ============================= UTILIDADES ============================= */
function esc(s){ return (s??"").toString().replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function pad(n,l){ return String(n).padStart(l,'0'); }
function todayParts(){ const d=new Date(); return {day:d.getDate(), month:d.getMonth()+1, year:d.getFullYear()}; }
function fmtDate(day,month,year){
  const meses=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
  return `${pad(day,2)} ${meses[month-1]} ${year}`;
}
function toast(msg, isError){
  const el = document.createElement('div');
  el.className = 'toast' + (isError?' error':'');
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 3400);
}
function parseHashQuery(){
  const hash = location.hash.slice(1);
  const qIdx = hash.indexOf('?');
  if(qIdx===-1) return {path:hash||'/', params:{}};
  const path = hash.slice(0,qIdx);
  const params = {};
  new URLSearchParams(hash.slice(qIdx+1)).forEach((v,k)=>params[k]=v);
  return {path, params};
}
function go(path){ location.hash = path; }

/* ============================= RENDER: LAYOUT RAÍZ ============================= */
async function renderRoute(){
  const {path, params} = parseHashQuery();
  const app = document.getElementById('app');
  app.setAttribute('data-fade','');
  if(path==='/' || path===''){ app.innerHTML = viewHome(); }
  else if(path==='/registro'){ app.innerHTML = viewRegistro(); wireRegistro(); }
  else if(path==='/confirmacion'){ app.innerHTML = viewConfirmacion(params.folio); wireConfirmacion(params.folio); }
  else if(path==='/estudiante'){ app.innerHTML = viewEstudianteShell(); await wireEstudiante(params.folio); }
  else if(path==='/admin'){
    if(!isAdminAuthed){ app.innerHTML = viewAdminLogin(); wireAdminLogin(); }
    else { app.innerHTML = viewAdminDashboardShell(); await wireAdminDashboard(); }
  }
  else { app.innerHTML = viewHome(); }
  window.scrollTo({top:0, behavior:'instant'});
}
window.addEventListener('hashchange', renderRoute);

/* ============================= VISTA: INICIO ============================= */
function viewHome(){
  const cards = Object.entries(MODALIDADES).map(([k,m])=>`
    <div class="mod-card">
      <div class="eyebrow">${esc(m.eyebrow)}</div>
      <h3>${esc(m.label)}</h3>
      <p>${esc(m.desc)}</p>
    </div>`).join('');
  return `
  <div class="hero">
    <h1>Preinscripciones abiertas</h1>
    <p class="lead">Registra a tu hijo o hija en la modalidad Modular o en Preparatoria de 3 o 4 meses. Sube tus documentos en línea y recibe al instante tu folio con código QR para dar seguimiento a tu trámite.</p>
    <div class="hero-actions">
      <a href="#/registro" class="btn btn-gold">Iniciar preinscripción</a>
      <a href="#/estudiante" class="btn btn-ghost">Ya tengo folio — ver mi registro</a>
    </div>
  </div>
  <div class="modalities">${cards}</div>
  <div class="card">
    <h2>¿Cómo funciona?</h2>
    <p class="card-sub">Un trámite sencillo, sin necesidad de acudir presencialmente para iniciar tu registro.</p>
    <div class="grid2">
      <div>
        <div class="section-title" style="margin-top:0">1 · Preinscripción</div>
        <p style="color:var(--ink-soft);font-size:14px;line-height:1.6">El padre, madre o tutor completa los datos del alumno y del tutor, y sube los documentos en PDF requeridos.</p>
      </div>
      <div>
        <div class="section-title" style="margin-top:0">2 · Folio y QR</div>
        <p style="color:var(--ink-soft);font-size:14px;line-height:1.6">Al terminar recibes un folio único y un código QR. Escanéalo cuando quieras para ver el estado del registro.</p>
      </div>
      <div>
        <div class="section-title" style="margin-top:0">3 · Revisión escolar</div>
        <p style="color:var(--ink-soft);font-size:14px;line-height:1.6">Control escolar revisa la documentación, registra el pago de inscripción y activa el servicio del alumno.</p>
      </div>
      <div>
        <div class="section-title" style="margin-top:0">4 · Colegiaturas</div>
        <p style="color:var(--ink-soft);font-size:14px;line-height:1.6">Cada pago de colegiatura queda registrado con fecha, y el estatus del alumno se mantiene activo mientras esté al corriente.</p>
      </div>
    </div>
  </div>
  <footer class="pagefoot">Centro Educativo CEM</footer>
  `;
}

/* ============================= VISTA: REGISTRO ============================= */
function viewRegistro(){
  const modOptions = Object.entries(MODALIDADES).map(([k,m])=>`<option value="${k}">${esc(m.label)}</option>`).join('');
  const docRows = DOCS_REQUERIDOS.map(d => `
    <div class="doc-row" id="row-${d.key}">
      <div>
        <div class="doc-label">${esc(d.label)}</div>
        <div class="doc-meta" id="meta-${d.key}">PDF, máx. ${MAX_FILE_MB} MB — sin cargar</div>
      </div>
      <div class="doc-actions">
        <span class="doc-status" id="status-${d.key}"></span>
        <label class="btn btn-ghost btn-sm file-btn">
          Elegir PDF
          <input type="file" accept="application/pdf" data-doc="${d.key}" class="doc-input">
        </label>
      </div>
    </div>`).join('');

  return `
  <div class="card" data-fade>
    <h2>Formulario de preinscripción</h2>
    <p class="card-sub">Todos los campos marcados con * son obligatorios. Los documentos deben entregarse en formato PDF.</p>
    <div id="registro-msg"></div>
    <form id="form-registro">
      <div class="section-title" style="margin-top:0">Modalidad</div>
      <div class="field">
        <label>Modalidad a la que se inscribe *</label>
        <select id="f-modalidad" required>
          <option value="">Selecciona una modalidad…</option>
          ${modOptions}
        </select>
      </div>

      <div class="section-title">Datos del alumno o alumna</div>
      <div class="grid2">
        <div class="field">
          <label>Nombre completo *</label>
          <input type="text" id="f-nombre" required>
        </div>
        <div class="field">
          <label>Fecha de nacimiento *</label>
          <input type="date" id="f-nacimiento" required>
        </div>
        <div class="field">
          <label>CURP *</label>
          <input type="text" id="f-curp" maxlength="18" style="text-transform:uppercase" required>
        </div>
        <div class="field">
          <label>Grado o nivel al que se inscribe *</label>
          <input type="text" id="f-grado" placeholder="Ej. 1er semestre" required>
        </div>
      </div>

      <div class="section-title">Datos del padre, madre o tutor</div>
      <div class="grid2">
        <div class="field">
          <label>Nombre completo *</label>
          <input type="text" id="f-tutor-nombre" required>
        </div>

function wireRegistro(){
  const fileObjs = {}; // docKey -> File

  document.querySelectorAll('.doc-input').forEach(input=>{
    input.addEventListener('change', (e)=>{
      const key = e.target.getAttribute('data-doc');
      const file = e.target.files[0];
      const metaEl = document.getElementById(`meta-${key}`);
      const statusEl = document.getElementById(`status-${key}`);
      const rowEl = document.getElementById(`row-${key}`);
      if(!file) return;
      if(file.type !== 'application/pdf'){
        metaEl.textContent = 'El archivo debe ser PDF.'; statusEl.textContent=''; rowEl.classList.remove('ok');
        e.target.value=''; return;
      }
      if(file.size > MAX_FILE_MB*1024*1024){
        metaEl.textContent = `El archivo pesa más de ${MAX_FILE_MB} MB.`;
        statusEl.textContent=''; rowEl.classList.remove('ok'); e.target.value=''; return;
      }
      fileObjs[key] = file;
      metaEl.textContent = file.name;
      statusEl.textContent = '✓ Listo';
      rowEl.classList.add('ok');
      updateProgress();
    });
  });

  function updateProgress(){
    const done = DOCS_REQUERIDOS.filter(d=>fileObjs[d.key]).length;
    document.getElementById('registro-progress').textContent = `${done} de ${DOCS_REQUERIDOS.length} documentos cargados`;
  }
  updateProgress();

  document.getElementById('form-registro').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const msgBox = document.getElementById('registro-msg');
    msgBox.innerHTML='';
    const modalidad = document.getElementById('f-modalidad').value;
    const missingDocs = DOCS_REQUERIDOS.filter(d=>!fileObjs[d.key]);
    if(!modalidad){ msgBox.innerHTML = `<div class="msg msg-error">Selecciona una modalidad.</div>`; return; }
    if(missingDocs.length){
      msgBox.innerHTML = `<div class="msg msg-error">Faltan documentos por cargar: ${missingDocs.map(d=>esc(d.label)).join(', ')}.</div>`;
      return;
    }
    const btn = document.getElementById('btn-submit-registro');
    btn.disabled = true; btn.textContent = 'Enviando…';
    try{
      const fd = new FormData();
      fd.append('modalidad', modalidad);
      fd.append('nombre', document.getElementById('f-nombre').value.trim());
      fd.append('nacimiento', document.getElementById('f-nacimiento').value);
      fd.append('curp', document.getElementById('f-curp').value.trim().toUpperCase());
      fd.append('grado', document.getElementById('f-grado').value.trim());
      fd.append('tutorNombre', document.getElementById('f-tutor-nombre').value.trim());
      fd.append('tutorTelefono', document.getElementById('f-tutor-tel').value.trim());
      fd.append('tutorCorreo', document.getElementById('f-tutor-correo').value.trim());
      DOCS_REQUERIDOS.forEach(d => fd.append(d.key, fileObjs[d.key]));

      const data = await api('/api/registro', { method:'POST', body: fd });
      go(`/confirmacion?folio=${encodeURIComponent(data.folio)}`);
    }catch(err){
      msgBox.innerHTML = `<div class="msg msg-error">${esc(err.message || 'Ocurrió un error al guardar el registro. Intenta de nuevo.')}</div>`;
      btn.disabled = false; btn.textContent = 'Enviar preinscripción';
    }
  });
}

      <td>$${Number(p.monto).toLocaleString('es-MX',{minimumFractionDigits:2})}</td>
      <td><button class="btn btn-danger btn-sm" data-del-pago="${p.id}">Eliminar</button></td>
    </tr>`).join('') : `<tr><td colspan="4" style="color:var(--ink-soft)">Sin pagos registrados.</td></tr>`;

  const t = todayParts();
  const monthOptions = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"]
    .map((mm,i)=>`<option value="${i+1}" ${i+1===t.month?'selected':''}>${mm}</option>`).join('');

  root.innerHTML = `
  <div class="overlay" id="modal-overlay">
    <div class="modal">
      <div class="modal-head">
        <div>
          <h2>${esc(rec.student.nombre)}</h2>
          <div class="sub">${esc(rec.folio)} · ${esc(m.label)}</div>
        </div>
        <button class="close-x" id="btn-close-modal">✕</button>
      </div>
      <div class="modal-body">
        <div class="section-title" style="margin-top:0">Datos del alumno</div>
        <div class="kv">
          <div><span class="k">CURP</span><span class="v">${esc(rec.student.curp)}</span></div>
          <div><span class="k">Fecha de nacimiento</span><span class="v">${esc(rec.student.nacimiento)}</span></div>
          <div><span class="k">Grado / nivel</span><span class="v">${esc(rec.student.grado)}</span></div>
        </div>
        <div class="section-title">Tutor</div>
        <div class="kv">
          <div><span class="k">Nombre</span><span class="v">${esc(rec.tutor.nombre)}</span></div>
          <div><span class="k">Teléfono</span><span class="v">${esc(rec.tutor.telefono)}</span></div>
          <div><span class="k">Correo</span><span class="v">${esc(rec.tutor.correo)}</span></div>
        </div>

        <div class="section-title">Documentos</div>
        ${docRows}

        <div class="section-title">Inscripción y estatus del servicio</div>
        <div class="grid2">
          <div class="field">
            <label><input type="checkbox" id="mod-insc" ${rec.inscripcionPagada?'checked':''}> Inscripción pagada</label>
          </div>
          <div class="field">
            <label>Estatus del servicio</label>
            <select id="mod-status">
              <option value="activo" ${rec.status==='activo'?'selected':''}>Activo</option>
              <option value="suspendido" ${rec.status==='suspendido'?'selected':''}>Suspendido</option>
            </select>
          </div>
        </div>
        <button class="btn btn-navy btn-sm" id="btn-save-status">Guardar cambios</button>

        <div class="section-title">Registrar pago de colegiatura</div>
        <div class="payform">
          <div><label>Concepto</label><input type="text" id="pay-concepto" value="Colegiatura"></div>
          <div><label>Día</label><input type="number" id="pay-day" min="1" max="31" value="${t.day}"></div>
          <div><label>Mes</label><select id="pay-month">${monthOptions}</select></div>
          <div><label>Año</label><input type="number" id="pay-year" value="${t.year}"></div>
          <div><label>Monto</label><input type="number" id="pay-monto" min="0" step="0.01" placeholder="$"></div>
          <div><button class="btn btn-gold btn-sm" id="btn-add-pago" style="margin-top:18px">Agregar</button></div>
        </div>

        <div class="section-title">Historial de pagos</div>
        <div class="table-wrap">
          <table><thead><tr><th>Concepto</th><th>Fecha</th><th>Monto</th><th></th></tr></thead><tbody>${payRows}</tbody></table>
        </div>

        <div class="section-title">Otras acciones</div>
        <button class="btn btn-danger btn-sm" id="btn-delete-student">Eliminar preinscripción</button>
      </div>
    </div>
  </div>`;

  document.getElementById('btn-close-modal').addEventListener('click', closeModal);
  document.getElementById('modal-overlay').addEventListener('click', (e)=>{ if(e.target.id==='modal-overlay') closeModal(); });

  document.getElementById('btn-save-status').addEventListener('click', async ()=>{
    try{
      await api(`/api/admin/estudiantes/${encodeURIComponent(rec.folio)}`, {
        method:'PATCH',
        body: JSON.stringify({ inscripcionPagada: document.getElementById('mod-insc').checked, status: document.getElementById('mod-status').value })
      });
      toast('Cambios guardados.');
      await refreshStudentsAndModal(rec.folio);
    }catch(err){ toast(err.message, true); }
  });

  document.getElementById('btn-add-pago').addEventListener('click', async ()=>{
    const monto = parseFloat(document.getElementById('pay-monto').value);
    if(!monto || monto<=0){ toast('Ingresa un monto válido.', true); return; }
    try{
      await api(`/api/admin/estudiantes/${encodeURIComponent(rec.folio)}/pagos`, {
        method:'POST',
        body: JSON.stringify({
          concepto: document.getElementById('pay-concepto').value.trim() || 'Colegiatura',
          day: document.getElementById('pay-day').value,
          month: document.getElementById('pay-month').value,
          year: document.getElementById('pay-year').value,
          monto,
        })
      });
      toast('Pago registrado.');
      await refreshStudentsAndModal(rec.folio);
    }catch(err){ toast(err.message, true); }
  });

  root.querySelectorAll('[data-del-pago]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      if(!confirm('¿Eliminar este pago del historial?')) return;
      try{
        await api(`/api/admin/estudiantes/${encodeURIComponent(rec.folio)}/pagos/${btn.getAttribute('data-del-pago')}`, { method:'DELETE' });
        await refreshStudentsAndModal(rec.folio);
      }catch(err){ toast(err.message, true); }
    });
  });

  document.getElementById('btn-delete-student').addEventListener('click', async ()=>{
    if(!confirm(`¿Eliminar por completo la preinscripción de ${rec.student.nombre} (${rec.folio})? Esta acción no se puede deshacer.`)) return;
    try{
      await api(`/api/admin/estudiantes/${encodeURIComponent(rec.folio)}`, { method:'DELETE' });
      closeModal();
      await refreshStudentsAndModal(null);
      toast('Registro eliminado.');
    }catch(err){ toast(err.message, true); }
  });
}

async function exportExcel(){
  try{
    const headers = {};
    if(adminToken) headers['Authorization'] = `Bearer ${adminToken}`;
    const res = await fetch('/api/admin/export', { headers });
    if(!res.ok) throw new Error('No se pudo generar el archivo.');
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `CEM_control_escolar_${new Date().toISOString().slice(0,10)}.xlsx`;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  }catch(err){ toast(err.message || 'Error al exportar.', true); }
}

async function openAccountModal(){
  const root = document.getElementById('admin-modal-root');
  root.innerHTML = `
  <div class="overlay" id="acc-overlay">
    <div class="modal" style="max-width:480px">
      <div class="modal-head">
        <div><h2>Mi cuenta</h2></div>
        <button class="close-x" id="acc-close">✕</button>
      </div>
      <div class="modal-body">
        <div id="acc-msg"></div>
        <div class="section-title" style="margin-top:0">Cambiar contraseña</div>
        <div class="field"><label>Contraseña actual</label><input type="password" id="acc-current"></div>
        <div class="field"><label>Nueva contraseña</label><input type="password" id="acc-new"></div>
        <div class="field"><label>Confirmar nueva contraseña</label><input type="password" id="acc-confirm"></div>
        <button class="btn btn-navy btn-sm" id="btn-change-pass">Actualizar contraseña</button>

        <div class="section-title">Correo de recuperación</div>
        <p class="fine" style="margin-top:-8px;margin-bottom:10px">A este correo se enviará el código para restablecer la contraseña si se te olvida.</p>
        <div class="field"><label>Correo</label><input type="email" id="acc-email"></div>
        <button class="btn btn-ghost btn-sm" id="btn-save-email">Guardar correo</button>
      </div>
    </div>
  </div>`;
  document.getElementById('acc-close').addEventListener('click', closeModal);
  document.getElementById('acc-overlay').addEventListener('click', (e)=>{ if(e.target.id==='acc-overlay') closeModal(); });
  document.getElementById('btn-change-pass').addEventListener('click', async ()=>{
    const currentPassword = document.getElementById('acc-current').value;
    const n1 = document.getElementById('acc-new').value;
    const n2 = document.getElementById('acc-confirm').value;
    const msg = document.getElementById('acc-msg');
    if(!n1 || n1 !== n2){ msg.innerHTML = `<div class="msg msg-error">Las contraseñas nuevas no coinciden.</div>`; return; }
    try{
      await api('/api/admin/change-password', { method:'POST', body: JSON.stringify({ currentPassword, newPassword: n1 }) });
      msg.innerHTML = `<div class="msg msg-ok">Contraseña actualizada.</div>`;
    }catch(err){ msg.innerHTML = `<div class="msg msg-error">${esc(err.message)}</div>`; }
  });
  document.getElementById('btn-save-email').addEventListener('click', async ()=>{
    try{
      await api('/api/admin/account/email', { method:'POST', body: JSON.stringify({ email: document.getElementById('acc-email').value.trim() }) });
      toast('Correo de recuperación guardado.');
    }catch(err){ toast(err.message, true); }
  });
}

/* ============================= INICIO ============================= */
renderRoute();
</script>
